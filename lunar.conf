# Central settings for the Lunar build scripts.
# Sourced by everything in scripts/. Change values here, not in the scripts.

# Where the [lunar] pacman repository is published. pacman appends
# "/<db or package file>" to this URL. GitHub release assets work well:
# create a release with the tag "x86_64" in the repo below and upload
# everything from repo/x86_64/ to it.
LUNAR_REPO_URL="https://github.com/WhitePeace36/lunar-repo/releases/download/x86_64"

# Name of the pacman repository (the [section] in pacman.conf).
LUNAR_REPO_NAME="lunar"

# GPG key that signs packages and the repo database. scripts/make-key.sh
# creates it and fills in this value.
LUNAR_SIGNING_KEY=""

# Packager line written into every package.
LUNAR_PACKAGER="Timon <timon2201@gmail.com>"

# Output directory of the local repo (relative to the project root).
LUNAR_REPO_DIR="repo/x86_64"

# Clean chroot used for building packages (needs ~10 GB).
LUNAR_CHROOT_DIR="/var/lib/lunar-build/chroot"
