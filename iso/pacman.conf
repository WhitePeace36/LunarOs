#
# pacman.conf used by mkarchiso to build the Lunar ISO.
# scripts/build-iso.sh fills in @LUNAR_REPO_SERVER@ (the local repo or the
# GitHub release URL). The live system itself gets airootfs/etc/pacman.conf.

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[lunar]
Server = @LUNAR_REPO_SERVER@

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
