# Lunar's neofetch defaults (lunar-zsh-config). neofetch loads its own default
# config first and then this file, so only Lunar's changes are here; run
# `neofetch --print_config` to see every option.

# Lunar's moon instead of neofetch's built-in "Lunar" logo (Lunar Linux's).
# Colours ($1 moon, $2 outline, $3 shadow, $4 craters) as close to lunar.svg as
# neofetch's 256 colours get.
image_backend="ascii"
image_source="/usr/share/lunar-zsh-config/fetch/lunar-neofetch.txt"
ascii_colors=(15 33 75 189)
