# SPDX-License-Identifier: CC0-1.0
#
# Lunar installer (upstream Calamares). Online install: the base system is
# installed with pacstrap from Arch's repositories and [lunar].
---
modules-search: [ local ]

instances:
- id:       initialize_pacman
  module:   shellprocess
  config:   shellprocess_initialize_pacman.conf
- id:       gpu
  module:   packagechooser
  config:   packagechooser_gpu.conf
- id:       online
  module:   packages
  config:   packages_online.conf
- id:       lunar_post
  module:   shellprocess
  config:   shellprocess_lunar_post.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - packagechooser@gpu
  - netinstall
  - users
  - summary
- exec:
  - partition
  - mount
  - shellprocess@initialize_pacman
  - pacstrap
  - machineid
  - locale
  - keyboard
  - localecfg
  - users
  - gpudrivers
  - packages@online
  - luksbootkeyfile
  - fstab
  - plymouthcfg
  - initcpiocfg
  - initcpio
  - networkcfg
  - hwclock
  - bootloader
  - services-systemd
  - shellprocess@lunar_post
  - umount
- show:
  - finished

branding: lunar
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
