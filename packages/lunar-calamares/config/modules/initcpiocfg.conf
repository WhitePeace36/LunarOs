# Lunar: mkinitcpio HOOKS are worked out by Calamares from the partition
# layout (encrypt, lvm2, openswap, resume, plymouth, btrfs). The classic
# busybox hooks are used because the openswap hook (encrypted swap) needs them.
---
useSystemdHook: false
hooks:
    prepend: []
    append: []
    remove: []
source: "/etc/mkinitcpio.conf"
