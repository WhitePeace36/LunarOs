# Lunar: mkinitcpio HOOKS are worked out by Calamares from the partition
# layout (sd-encrypt, lvm2, plymouth, btrfs). The systemd-based hooks are used
# (systemd, sd-vconsole, sd-encrypt), as in Arch's default mkinitcpio.conf:
# an encrypted root is unlocked with rd.luks.uuid= (written by the bootloader
# step), with Plymouth's password prompt.
---
useSystemdHook: true
hooks:
    prepend: []
    append: []
    remove: []
source: "/etc/mkinitcpio.conf"
