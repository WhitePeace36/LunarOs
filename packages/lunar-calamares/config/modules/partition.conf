---
# The EFI partition holds systemd-boot, the kernels and their initramfs
# (two kernels with fallback images need about 400 MiB).
efi:
    mountPoint:         "/boot"
    recommendedSize:    2GiB
    minimumSize:        1GiB
    label:              "EFI"

# Lunar swaps to zram; a swap partition or file is only needed for hibernation.
userSwapChoices:
    - none
    - suspend
    - file
initialSwapChoice: none

luksGeneration: luks2
drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: none

defaultFileSystemType:  "btrfs"
availableFileSystemTypes:  ["btrfs", "ext4", "xfs", "f2fs"]
