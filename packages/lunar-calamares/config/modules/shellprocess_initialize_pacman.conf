---
# On the live system, before pacstrap: fast Arch mirrors, current keyrings.
dontChroot: true
timeout: 1800
script:
  - command: "/etc/calamares/scripts/update-mirrorlist"
    timeout: 600
  - command: "/etc/calamares/scripts/create-pacman-keyring"
i18n:
  name: "Preparing the package manager"
  name[de]: "Paketverwaltung vorbereiten"
