# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
# Lunar graphics driver choice. Stored as "packagechooser_gpu" and read by
# the gpudrivers module, which runs lunar-gpu-setup in the new system.
#
#   auto - picks per GPU, Wayland-capable drivers only:
#          NVIDIA Turing (GTX 16xx / RTX 20xx) and newer -> nvidia-open (current)
#          NVIDIA Maxwell, Pascal, Volta                  -> nvidia 580xx (legacy)
#          NVIDIA Kepler and older                        -> nouveau (Mesa)
#          AMD, Intel                                     -> Mesa
#   mesa - open source drivers for every GPU (NVIDIA cards use nouveau/NVK)
---
mode: required
method: legacy

labels:
    step: "Graphics"
    step[de]: "Grafik"

default: auto

items:
    - id: auto
      name: "Automatic (recommended)"
      name[de]: "Automatisch (empfohlen)"
      description: "Detects your graphics card and installs the right driver. NVIDIA cards get NVIDIA's own driver in the newest version that supports them: the current driver for GTX 16xx / RTX 20xx and newer, the 580 legacy driver for GTX 750 to GTX 10xx. Older NVIDIA cards, which NVIDIA no longer supports on Wayland, get the open source nouveau driver. AMD and Intel always use Mesa. Laptops with two GPUs get both drivers."
      description[de]: "Erkennt die Grafikkarte und installiert den passenden Treiber. NVIDIA-Karten bekommen NVIDIAs eigenen Treiber in der neuesten Version, die sie unterstützt: den aktuellen Treiber für GTX 16xx / RTX 20xx und neuer, den 580-Legacy-Treiber für GTX 750 bis GTX 10xx. Ältere NVIDIA-Karten, die NVIDIA unter Wayland nicht mehr unterstützt, bekommen den freien nouveau-Treiber. AMD und Intel nutzen immer Mesa. Laptops mit zwei GPUs bekommen beide Treiber."

    - id: mesa
      name: "Open source only (Mesa)"
      name[de]: "Nur freie Treiber (Mesa)"
      description: "Uses the open source Mesa drivers for every graphics card. Best choice for AMD and Intel (identical to Automatic there). On NVIDIA cards this uses nouveau with the NVK Vulkan driver: works well on RTX 20xx and newer, but GTX 10xx and older stay at low clock speeds, so games run much slower than with NVIDIA's driver."
      description[de]: "Verwendet für jede Grafikkarte die freien Mesa-Treiber. Beste Wahl für AMD und Intel (dort identisch mit Automatisch). Auf NVIDIA-Karten wird nouveau mit dem Vulkan-Treiber NVK genutzt: läuft gut ab RTX 20xx, aber GTX 10xx und älter bleiben auf niedrigen Taktraten, Spiele laufen dort deutlich langsamer als mit NVIDIAs Treiber."
