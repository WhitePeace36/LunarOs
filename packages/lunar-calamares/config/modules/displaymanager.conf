#
# Lunar: applies the "Log in automatically" choice of the user page to
# Plasma Login Manager. Writes [Autologin] User= and Session= into
# /etc/plasmalogin.conf of the new system, the file System Settings > Login
# Screen edits as well; without the tick, User= is removed. Runs after
# packages@online, which installs plasma-login-manager (the module skips a
# display manager whose program isn't installed yet).
---
displaymanagers:
  - plasmalogin

# Plasma on Wayland (/usr/share/wayland-sessions/plasma.desktop). Without
# this the module looks for startplasma-x11, which a Wayland-only install
# doesn't have, and writes no Session=.
defaultDesktopEnvironment:
    executable: "startplasma-wayland"
    desktopFile: "plasma"

# Plasma Login Manager needs no other setup
basicSetup: false
sysconfigSetup: false
