---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: wheel
      must_exist: false
      system: true
    - audio
    - video
    - input
    - network
    - storage
    - lp
    - scanner

autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    wheel
sudoersConfigureWithGroup: true

# root stays locked; the user administers the system with sudo
setRootPassword: false
doReusePassword: false

passwordRequirements:
    minLength: 1
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true

user:
  shell: /bin/zsh
  forbidden_names: [ root ]

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "lunar-${cpu}"
  forbidden_names: [ localhost ]
