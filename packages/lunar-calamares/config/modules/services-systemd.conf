---
units:
  - name: NetworkManager.service
    action: enable
    mandatory: true
  - name: systemd-resolved.service
    action: enable
    mandatory: false
  - name: bluetooth.service
    action: enable
    mandatory: false
  - name: cups.socket
    action: enable
    mandatory: false
  - name: avahi-daemon.service
    action: enable
    mandatory: false
  - name: plasmalogin.service
    action: enable
    mandatory: true
  - name: fstrim.timer
    action: enable
    mandatory: false
  # database of the "command not found" hint in zsh (lunar-zsh-config)
  - name: pkgfile-update.timer
    action: enable
    mandatory: false
  - name: systemd-boot-update.service
    action: enable
    mandatory: false
  - name: ananicy-cpp.service
    action: enable
    mandatory: false
  - name: elara.service
    action: enable
    mandatory: false
  - name: ufw.service
    action: enable
    mandatory: false
  # Lunar: no realtime priorities via D-Bus; Elara schedules audio by nice value
  - name: rtkit-daemon.service
    action: mask
    mandatory: false
