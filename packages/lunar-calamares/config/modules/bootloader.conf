---
# systemd-boot (UEFI). Calamares installs it and writes /etc/kernel/cmdline
# for this machine (root, LUKS, Btrfs subvolume); shellprocess@lunar_post
# then hands the boot entries over to lunar-sdboot-update.
efiBootLoader: "systemd-boot"
kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"
loaderEntries:
    - "timeout 3"
    - "console-mode keep"
kernelParams: [ "quiet" ]

# unused with systemd-boot, but read by the module
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: true
