---
# Inside the new system, at the end: boot entries, firewall, Flatseal, zsh.
dontChroot: false
timeout: 1800
script:
  - command: "/etc/calamares/scripts/lunar-post-install ${USER}"
  - "-rm -f /etc/calamares/scripts/lunar-post-install"
i18n:
  name: "Finishing the Lunar setup"
  name[de]: "Lunar-Einrichtung abschließen"
