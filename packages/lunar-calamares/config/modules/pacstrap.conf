---
# Lunar's own pacstrap step (modules/pacstrap). Kernels
# and CPU microcode are added by the module from the installer's choices.
pacmanConf: /usr/share/lunar-calamares/pacman.conf

basePackages:
  # system
  - base
  - base-devel
  - linux-firmware
  - sof-firmware
  - mkinitcpio
  - plymouth
  - sudo
  - zsh
  - man-db
  - man-pages
  - less
  - which
  - usbutils
  - pciutils
  - efibootmgr
  # filesystems and storage
  - btrfs-progs
  - dosfstools
  - e2fsprogs
  - exfatprogs
  - f2fs-tools
  - xfsprogs
  - ntfs-3g
  - cryptsetup
  - lvm2
  - mdadm
  # pacman
  - archlinux-keyring
  - pacman-mirrorlist
  - reflector
  # Sound server. Here and not only on the software page: lunar-kde-settings
  # and pipewire-configurator-simple below pull in Plasma and PipeWire, whose
  # dependencies need a JACK library. Without pipewire-jack in the same
  # transaction pacman picks jack2, and the software step then fails on the
  # pipewire-jack/jack2 conflict (pacman --noconfirm answers "no" to
  # removing a package).
  - pipewire
  - pipewire-alsa
  - pipewire-jack
  - pipewire-pulse
  - wireplumber
  # Lunar (here and not on the software page: lunar-zsh-config puts .zshrc
  # into /etc/skel, which must exist before the user is created)
  - lunar-keyring
  - lunar-mirrorlist
  - lunar-hooks
  - lunar-settings
  - lunar-kde-settings
  - lunar-zsh-config
  - ananicy-cpp-lunar
  - lunar-ananicy-rules
  - elara
  - pipewire-configurator-simple
  - ananicy-configurator

postInstallFiles:
  - from: /etc/calamares/scripts/lunar-post-install
    to:   /etc/calamares/scripts/lunar-post-install
