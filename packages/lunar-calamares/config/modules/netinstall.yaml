# Lunar: software installed on top of the base system (installer page
# "Additional software"). Groups marked critical can't be unticked.
# Packages marked [lunar] are built from the AUR into the [lunar] repo
# (packages/aur-packages.txt).

# Lunar's own packages (settings, Elara, ananicy-cpp + rules, the two
# configurators, zsh and KDE setup) are installed by the pacstrap step
# (pacstrap.conf), before the user is created.

- name: "KDE Plasma"
  description: "Plasma desktop with Plasma Login Manager and the KDE core apps"
  selected: true
  critical: true
  packages:
    - plasma-desktop
    - plasma-login-manager
    - plasma-nm
    - plasma-pa
    - plasma-firewall
    - plasma-systemmonitor
    - plasma-thunderbolt
    - plasma-browser-integration
    - kdeplasma-addons
    - powerdevil
    - bluedevil
    - kscreen
    - kwallet-pam
    - kwalletmanager
    - kde-gtk-config
    - breeze-gtk
    - xsettingsd
    - kinfocenter
    - kio-admin
    - plymouth-kcm
    - flatpak-kcm
    - discover
    - konsole
    - dolphin
    - ark
    - kate
    - kcalc
    - spectacle
    - gwenview
    - haruna
    - filelight
    - partitionmanager
    - ffmpegthumbs
    - kdegraphics-thumbnailers
    - kdialog

- name: "Hardware and system"
  description: "Network, Wi-Fi, Bluetooth, sound, firewall, power and firmware"
  selected: true
  critical: true
  subgroups:
    - name: "Network"
      selected: true
      packages:
        - networkmanager
        - networkmanager-openvpn
        - iwd
        - wpa_supplicant
        - modemmanager
        - usb_modeswitch
        - wireless-regdb
        - avahi
        - nss-mdns
        - dnsmasq
        - bind
        - ethtool
        - net-tools
    - name: "Firewall"
      description: "ufw: incoming connections blocked except LocalSend"
      selected: true
      packages:
        - ufw
    - name: "Bluetooth"
      selected: true
      packages:
        - bluez
        - bluez-utils
        - bluez-obex
    - name: "Sound"
      selected: true
      packages:
        - pipewire
        - pipewire-alsa
        - pipewire-jack
        - pipewire-pulse
        - wireplumber
        - alsa-utils
        - alsa-firmware
        - pavucontrol
        - realtime-privileges
    - name: "Power and firmware"
      selected: true
      packages:
        - power-profiles-daemon
        - upower
        - cpupower
        - fwupd
        - hdparm
        - smartmontools
        - mesa-utils
        - vulkan-tools

