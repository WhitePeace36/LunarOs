# Lunar: the login screen (Plasma Login Manager) shows the same wallpaper as
# the desktop and the lock screen, "Wordmark Lockup"
# (branding/20-wordmark-lockup.png, package lunar-wallpapers). This is the
# distribution default: a wallpaper picked in System Settings > Login Screen
# goes into /etc/plasmalogin.conf and wins.
[Greeter]
WallpaperPluginId=org.kde.image

[Greeter][Wallpaper][org.kde.image][General]
Image=file:///usr/share/wallpapers/lunar-wordmark-lockup/
PreviewImage=file:///usr/share/wallpapers/lunar-wordmark-lockup/
