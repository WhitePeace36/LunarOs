# Lunar: the login screen (Plasma Login Manager) shows the same wallpaper as
# the lock screen, "Moonlit Lake" (branding/26-busy-moonlit-lake.png, package
# lunar-wallpapers). This is the distribution default: a wallpaper picked in
# System Settings > Login Screen goes into /etc/plasmalogin.conf and wins.
[Greeter]
WallpaperPluginId=org.kde.image

[Greeter][Wallpaper][org.kde.image][General]
Image=file:///usr/share/wallpapers/lunar-moonlit-lake/
PreviewImage=file:///usr/share/wallpapers/lunar-moonlit-lake/
