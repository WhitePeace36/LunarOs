# Lunar's settings for building linux-lunar as the distro kernel.
# prepare.sh appends this file to linux-lunar's customization.cfg, so every
# value here wins over the repo's defaults. Options not listed keep the
# linux-lunar defaults (patches, compiled-in memory defaults, THP, MGLRU...).
#
# Differences from a personal linux-lunar build, because one package has to
# run on every PC and laptop:
#   _march          generic instead of native (native only runs on the build CPU)
#   _cpu_governor   schedutil instead of performance, and
#   _tickless       idle instead of periodic: both cost battery on laptops.
#                   lunar-tuning-performance adds cpufreq.default_governor=
#                   performance and nohz=off to the kernel command line, which
#                   gives desktops linux-lunar's defaults back.
#   _user_patches   off, _noninteractive on: builds must be reproducible.

# Exact release; bump it (and reset pkgrel) to update the distro kernel.
_version="7.3.3"

_base_config="arch"
_localmodconfig="false"
_menuconfig="none"

_compiler="gcc"
_lto_mode="none"
_march="generic"

_timer_freq="1000"
_preempt="full"
_preempt_dynamic="true"
_tickless="idle"
_cpu_governor="schedutil"

_build_headers="true"
_user_patches="false"
_user_patches_confirm="false"
_noninteractive="true"
_pgp_verify="true"
_cleanup_on_abort="false"
_cleanup_after_build="false"
