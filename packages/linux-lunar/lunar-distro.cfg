# Lunar's settings for building linux-lunar as the distro kernel.
# prepare.sh appends this file to linux-lunar's customization.cfg, so every
# value here wins over the repo's defaults. Options not listed keep the
# linux-lunar defaults (patches, compiled-in memory defaults, THP, MGLRU...).
#
# Lunar ships two builds of the same kernel, both from this file:
#   linux-lunar     this file as it is: GCC, no LTO, generic x86-64. Runs on
#                   every x86-64 CPU; the live ISO boots it, and the installer
#                   installs it on CPUs without x86-64-v3.
#   linux-lunar-v3  this file plus packages/linux-lunar-v3/lunar-distro.cfg:
#                   Clang with ThinLTO, -march=x86-64-v3 (AVX2: Intel Haswell,
#                   AMD Zen 1 and newer). The installer picks it when it can.
# Both build the same _version from the same linux-lunar commit (_commit in
# prepare.sh), so one bump here updates both.
#
# Differences from a personal linux-lunar build:
#   _march          generic / x86-64-v3 instead of native: a package has to run
#                   on more CPUs than the one that built it
#   _user_patches   off, _noninteractive on: builds must be reproducible
# Tick (periodic) and CPU governor (performance) are linux-lunar's defaults;
# Lunar's kernel parameters rely on them and don't set nohz= or
# cpufreq.default_governor= themselves.

# Exact release; bump it (and reset pkgrel) to update both distro kernels.
_version="7.3.4"

_base_config="arch"
_localmodconfig="false"
_menuconfig="none"

_pkgsuffix="lunar"
_compiler="gcc"
_lto_mode="none"
_march="generic"

_timer_freq="1000"
_preempt="full"
_preempt_dynamic="true"
_tickless="periodic"
_cpu_governor="performance"

_build_headers="true"
_user_patches="false"
_user_patches_confirm="false"
_noninteractive="true"
_pgp_verify="true"
_cleanup_on_abort="false"
_cleanup_after_build="false"
