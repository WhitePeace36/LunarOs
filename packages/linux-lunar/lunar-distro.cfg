# Lunar's settings for building linux-lunar as the distro kernel.
# prepare.sh appends this file to linux-lunar's customization.cfg, so it only
# lists what Lunar changes; everything else (timer, preemption, governor,
# headers, patches, memory defaults...) stays at linux-lunar's defaults.
#
# Lunar ships two builds of the same kernel:
#   linux-lunar     this file: GCC, no LTO, generic x86-64. Runs on every
#                   x86-64 CPU; the live ISO boots it, and the installer
#                   installs it on CPUs without x86-64-v3.
#   linux-lunar-v3  this file plus packages/linux-lunar-v3/lunar-distro.cfg:
#                   Clang with ThinLTO, -march=x86-64-v3 (AVX2: Intel Haswell,
#                   AMD Zen 1 and newer). The installer picks it when it can.
# Both build the same _version from the same linux-lunar commit (_commit in
# prepare.sh), so one bump here updates both.

# Exact release; bump it (and reset pkgrel) to update both distro kernels.
_version="7.3.5"

# linux-lunar's defaults are clang + ThinLTO + native (the build CPU only)
_compiler="gcc"
_lto_mode="none"
_march="generic"

# builds must be reproducible: no user patches, never ask
_user_patches="false"
_user_patches_confirm="false"
_noninteractive="true"
