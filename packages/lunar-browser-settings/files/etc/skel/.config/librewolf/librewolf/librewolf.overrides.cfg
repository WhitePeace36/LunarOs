// Lunar's defaults for LibreWolf (lunar-browser-settings). LibreWolf reads this
// file after its own librewolf.cfg. Change or delete lines here, or set the
// options in LibreWolf's settings / about:config; those always win.
// https://librewolf.net/docs/settings/

// DNS over HTTPS on: "Increased protection" (DoH first, the system's DNS when
// the DoH server can't be reached), provider "Quad9 (No Filtering)" (dns10: no
// malware blocking), one of LibreWolf's built-in providers. LibreWolf's own
// default is DoH off.
defaultPref("network.trr.mode", 2);
defaultPref("network.trr.uri", "https://dns10.quad9.net/dns-query");

// resistFingerprinting off: websites get the real time zone, window size and
// colour scheme (it also kept websites light).
defaultPref("privacy.resistFingerprinting", false);

// Settings > Privacy & Security > History: "Clear history when LibreWolf
// closes" off. LibreWolf turns it on, and its list of what to clear keeps the
// browsing history but deletes cookies, site data and the cache on every
// close, which logs you out of every website.
defaultPref("privacy.sanitize.sanitizeOnShutdown", false);

// Dark websites. The browser itself uses its default "System theme - auto",
// which is dark with Lunar's Breeze Dark.
defaultPref("layout.css.prefers-color-scheme.content-override", 0);

// Bookmarks toolbar and the Youtube bookmark: /etc/librewolf/policies/policies.json
// (LibreWolf's policies plus Lunar's, see /usr/lib/lunar/librewolf-policies)

// Set by LibreWolf already (listed for completeness):
//   uBlock Origin installed, DuckDuckGo as search engine, HTTPS-only mode in
//   all windows, signon.rememberSignons=false (no "save password?"),
//   extensions.formautofill.creditCards.enabled=false (no payment autofill)
