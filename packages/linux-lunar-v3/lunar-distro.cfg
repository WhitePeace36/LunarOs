# linux-lunar-v3: the overrides on top of packages/linux-lunar/lunar-distro.cfg.
# packages/linux-lunar/prepare.sh appends that file first and this one after
# it, so everything not set here (version, timer, preemption, headers...) is
# the same as in linux-lunar.
#
# Runs only on CPUs with x86-64-v3 (AVX2, BMI2, FMA, MOVBE: Intel Haswell,
# AMD Zen 1 and newer). On older CPUs it stops right at boot, so the installer
# installs it only after checking the CPU, and the live ISO doesn't use it.
#
# Package linux-lunar-v3 (+ -headers), kernel release 7.x.y-N-lunar-v3: it
# installs next to linux-lunar without file conflicts.

_version="7.3.5"

_pkgsuffix="lunar-v3"
_compiler="llvm"
_lto_mode="thin"
_march="x86-64-v3"


# builds must be reproducible: no user patches, never ask
_user_patches="false"
_user_patches_confirm="false"
_noninteractive="true"
